[project]
name = "isotools_extensions"
requires-python = ">= 3.11"
version = "0.1.7"
authors = [{name = "Brandon Seah", email = "brandon_seah@tll.org.sg"}]
dependencies = [
    "isotools @ git+https://github.com/kbseah/IsoTools2.git@9f9b25ee3b5fdda21c59bfe70a12dc42259b8d91",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyhmmer~=0.12.0",
]

[project.urls]
Homepage = "https://github.com/kbseah/isotools_extensions"
Repository = "https://github.com/kbseah/isotools_extensions.git"
Issues = "https://github.com/kbseah/isotools_extensions/issues"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >=77.0.3"]
